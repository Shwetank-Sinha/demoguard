apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoguard-workload
  namespace: demoguard-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoguard-workload
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: demoguard-workload
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
