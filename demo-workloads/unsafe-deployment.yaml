apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hackathon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
