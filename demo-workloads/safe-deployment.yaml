apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackathon-app
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hackathon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: hackathon-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
