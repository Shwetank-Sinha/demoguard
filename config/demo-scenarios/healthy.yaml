apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoguard-healthy
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: healthy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demoguard-healthy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demoguard-healthy
        app.kubernetes.io/part-of: demoguard-demo
        demoguard.dev/scenario: healthy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demoguard-healthy
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: healthy
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demoguard-healthy
---
apiVersion: demoguard.dev/v1alpha1
kind: DemoPolicy
metadata:
  name: demoguard-healthy
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: healthy
spec:
  targetNamespace: demoguard-demo
  targetDeployment: demoguard-healthy
  minimumReplicas: 2
  demoDurationMinutes: 30

