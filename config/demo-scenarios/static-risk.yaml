apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoguard-static-risk
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: static-risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demoguard-static-risk
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demoguard-static-risk
        app.kubernetes.io/part-of: demoguard-demo
        demoguard.dev/scenario: static-risk
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: demoguard.dev/v1alpha1
kind: DemoPolicy
metadata:
  name: demoguard-static-risk
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: static-risk
spec:
  targetNamespace: demoguard-demo
  targetDeployment: demoguard-static-risk
  minimumReplicas: 2
  demoDurationMinutes: 30

