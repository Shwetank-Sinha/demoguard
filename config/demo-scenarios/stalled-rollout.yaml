apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoguard-stalled-rollout
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: stalled-rollout
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: demoguard-stalled-rollout
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demoguard-stalled-rollout
        app.kubernetes.io/part-of: demoguard-demo
        demoguard.dev/scenario: stalled-rollout
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          # NGINX returns 404 here, keeping the real pod unready until the progress deadline expires.
          readinessProbe:
            httpGet:
              path: /demoguard-intentionally-not-ready
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demoguard-stalled-rollout
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: stalled-rollout
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demoguard-stalled-rollout
---
apiVersion: demoguard.dev/v1alpha1
kind: DemoPolicy
metadata:
  name: demoguard-stalled-rollout
  namespace: demoguard-demo
  labels:
    app.kubernetes.io/part-of: demoguard-demo
    demoguard.dev/scenario: stalled-rollout
spec:
  targetNamespace: demoguard-demo
  targetDeployment: demoguard-stalled-rollout
  minimumReplicas: 2
  demoDurationMinutes: 30

