apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: demoreadinesses.demoguard.dev
spec:
  group: demoguard.dev
  scope: Namespaced
  names:
    plural: demoreadinesses
    singular: demoreadiness
    kind: DemoReadiness
    listKind: DemoReadinessList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.readinessStatus
        - name: Score
          type: integer
          jsonPath: .status.score
        - name: Runtime
          type: string
          jsonPath: .status.runtimeStatus
        - name: CPU Risk
          type: string
          jsonPath: .status.cpuRisk
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              required:
                - readinessStatus
                - score
                - findings
                - recommendations
                - memoryRisk
                - predictionMessage
                - cpuRisk
                - cpuPredictionMessage
                - runtimeStatus
                - desiredReplicas
                - readyReplicas
                - availableReplicas
                - unavailableReplicas
                - totalRestarts
                - runtimeMessage
              properties:
                readinessStatus:
                  type: string
                  enum: [READY, WARNING, BLOCKED]
                score:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 100
                findings:
                  type: array
                  items:
                    type: string
                recommendations:
                  type: array
                  items:
                    type: string
                memoryRisk:
                  type: string
                  enum: [SAFE, AT_RISK, UNKNOWN]
                currentMemoryBytes:
                  type: integer
                  format: int64
                memoryLimitBytes:
                  type: integer
                  format: int64
                predictedMemoryBytesAtDemoEnd:
                  type: integer
                  format: int64
                predictedLimitBreachInMinutes:
                  type: number
                  format: double
                predictionMessage:
                  type: string
                cpuRisk:
                  type: string
                  enum: [SAFE, AT_RISK, UNKNOWN]
                currentCpuCores:
                  type: number
                  format: double
                cpuLimitCores:
                  type: number
                  format: double
                predictedCpuCoresAtDemoEnd:
                  type: number
                  format: double
                cpuThrottlingRate:
                  type: number
                  format: double
                cpuPredictionMessage:
                  type: string
                runtimeStatus:
                  type: string
                  enum: [HEALTHY, DEGRADED, UNHEALTHY]
                desiredReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                readyReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                availableReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                unavailableReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                totalRestarts:
                  type: integer
                  format: int32
                  minimum: 0
                runtimeMessage:
                  type: string
