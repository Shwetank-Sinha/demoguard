apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: demoreadinesses.demoguard.dev
spec:
  group: demoguard.dev
  scope: Namespaced
  names:
    plural: demoreadinesses
    singular: demoreadiness
    kind: DemoReadiness
    listKind: DemoReadinessList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.readinessStatus
        - name: Score
          type: integer
          jsonPath: .status.score
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status:
              type: object
              required:
                - readinessStatus
                - score
                - findings
                - recommendations
              properties:
                readinessStatus:
                  type: string
                  enum: [READY, WARNING, BLOCKED]
                score:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 100
                findings:
                  type: array
                  items:
                    type: string
                recommendations:
                  type: array
                  items:
                    type: string
