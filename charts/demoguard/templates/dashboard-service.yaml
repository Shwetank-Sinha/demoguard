apiVersion: v1
kind: Service
metadata:
  name: {{ include "demoguard.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "demoguard.name" . }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
