apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demoguard.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "demoguard.name" . }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "demoguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "demoguard.name" . }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "demoguard.operatorServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
