apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demoguard.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "demoguard.name" . }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "demoguard.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "demoguard.name" . }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "demoguard.dashboardServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djava.io.tmpdir=/tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
