apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "demoguard.dashboardName" . }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["demoguard.dev"]
    resources: ["demopolicies", "demoreadinesses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["demoguard.dev"]
    resources: ["demopolicies"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "demoguard.dashboardName" . }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "demoguard.dashboardName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "demoguard.dashboardServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
