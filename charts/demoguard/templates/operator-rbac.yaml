apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "demoguard.operatorName" . }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: ["demoguard.dev"]
    resources: ["demopolicies"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["demoguard.dev"]
    resources: ["demoreadinesses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["demoguard.dev"]
    resources: ["demoreadinesses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "demoguard.operatorName" . }}
  labels:
    {{- include "demoguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "demoguard.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "demoguard.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
