apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: demopolicies.demoguard.dev
spec:
  group: demoguard.dev
  scope: Namespaced
  names:
    plural: demopolicies
    singular: demopolicy
    kind: DemoPolicy
    listKind: DemoPolicyList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - targetNamespace
                - targetDeployment
              properties:
                targetNamespace:
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$'
                targetDeployment:
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$'
                minimumReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 2
                demoDurationMinutes:
                  description: Duration of the planned demo used for CPU and memory-risk forecasting.
                  type: integer
                  format: int32
                  minimum: 1
                  default: 30
